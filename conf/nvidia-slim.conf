# /etc/dracut.conf.d/nvidia.conf, installed by dracut-nvidia-slim/install.sh
# (uninstall.sh replaces it with the full force_drivers version).

# NVIDIA modules for early KMS, with only the firmware for the installed GPU
add_dracutmodules+=" nvidia-slim "

# nouveau is blacklisted, but hostonly still adds it along with ~150 MB of GSP firmware
omit_drivers+=" nouveau "
