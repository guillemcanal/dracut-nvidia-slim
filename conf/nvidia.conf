# /etc/dracut.conf.d/nvidia.conf, installed by dracut-nvidia-slim/uninstall.sh
# (install.sh replaces it with the nvidia-slim version).

# NVIDIA modules for early KMS, with all of their firmware
force_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "

# nouveau is blacklisted, but hostonly still adds it along with ~150 MB of GSP firmware
omit_drivers+=" nouveau "
